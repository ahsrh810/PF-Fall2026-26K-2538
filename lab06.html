<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Big Apple</title>
</head>
<body>
    <header>
        <h1>Big Apple</h1>
        <nav>
            <ul>
                <li><a href="#home"></a>Home</li>
                <li><a href="#menu"></a>Menu</li>
                <li><a href="#contact"></a>Contact</li>
            </ul>
        </nav>
    </header>
    <section id="home">
        <div>
            <h2>Welcome to Red Apple</h2>
            <p>Experience our delicious food!</p>
            <a href="#menu">Explore Menu</a>
        </div>
    </section>
    <section id="Menu">
        <h2>Our Menu</h2>
        <div class="food-container">
            <div class="food-card">
                <img src="burger.png">
                <h3>Classic Burger</h3>
                <p class="price">Rs 590</p>
                <a href="order.html" class="order-btn">Order Now</a>
            </div>
            <div class="food-card">
                <img src="pizza.jpg">
                <h3>Pepperoni Pizza</h3>
                <p class="price">Rs 1150</p>
                <a href="order.html" class="order-btn">Order Now</a>
            </div>
            <div class="food-card">
                <img src="pasta.png">
                <h3>Creamy Pasta</h3>
                <p class="price">Rs 950</p>
                <a href="order.html" class="order-btn">Order Now</a>
            </div>
        </div>
    </section>
    
</body>    
</html>
